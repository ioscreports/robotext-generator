<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROBOTEXT GENERATOR</title>
  <style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --whatsapp: #25d366;
  --whatsapp-dark: #1da851;
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --radius: 10px;
  --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  padding: 1.25rem;
}

.app {
  max-width: 640px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 1.5rem;
}

.header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 0.25rem;
}

.header p {
  color: var(--muted);
  font-size: 0.95rem;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.25rem 1.4rem;
  margin-bottom: 1.25rem;
}

.hidden {
  display: none !important;
}

.label,
.field label {
  display: block;
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 0.4rem;
  color: var(--text);
}

.select,
.input {
  width: 100%;
  padding: 0.7rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 1rem;
  font-family: inherit;
  background: #fff;
  transition: border-color 0.15s;
}

.select:focus,
.input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

.input.readonly {
  background: #f8fafc;
  color: var(--muted);
  cursor: default;
}

.textarea {
  resize: vertical;
  min-height: 80px;
}

.section-title {
  font-size: 1.15rem;
  margin-bottom: 1.1rem;
  color: var(--primary);
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.field.full {
  grid-column: 1 / -1;
}

/* Searchable store dropdown */
.search-wrap {
  position: relative;
}

.dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  max-height: 260px;
  overflow-y: auto;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  z-index: 50;
  list-style: none;
  margin-top: 4px;
}

.dropdown li {
  padding: 0.65rem 0.9rem;
  cursor: pointer;
  font-size: 0.92rem;
  border-bottom: 1px solid #f1f5f9;
}

.dropdown li:hover,
.dropdown li.active {
  background: #eff6ff;
  color: var(--primary);
}

.dropdown li:last-child {
  border-bottom: none;
}

.actions {
  display: flex;
  gap: 0.75rem;
  margin-top: 1.25rem;
  flex-wrap: wrap;
}

.btn {
  flex: 1;
  min-width: 120px;
  padding: 0.75rem 1.1rem;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}

.btn:active {
  transform: scale(0.98);
}

.btn.primary {
  background: var(--primary);
  color: #fff;
}

.btn.primary:hover {
  background: var(--primary-dark);
}

.btn.secondary {
  background: #e2e8f0;
  color: var(--text);
}

.btn.secondary:hover {
  background: #cbd5e1;
}

.btn.whatsapp {
  background: var(--whatsapp);
  color: #fff;
}

.btn.whatsapp:hover {
  background: var(--whatsapp-dark);
}

.output {
  width: 100%;
  padding: 1rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
  font-size: 0.9rem;
  line-height: 1.55;
  background: #f8fafc;
  resize: vertical;
  white-space: pre-wrap;
}

.feedback {
  text-align: center;
  margin-top: 0.75rem;
  color: #16a34a;
  font-weight: 600;
  font-size: 0.9rem;
}

/* Photo upload (multiple) */
.photo-area {
  position: relative;
}

.photo-input {
  position: absolute;
  width: 0.1px;
  height: 0.1px;
  opacity: 0;
  overflow: hidden;
  z-index: -1;
}

.photo-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  padding: 1.5rem 1rem;
  border: 2px dashed var(--border);
  border-radius: 10px;
  background: #f8fafc;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  text-align: center;
}

.photo-label:hover {
  border-color: var(--primary);
  background: #eff6ff;
}

.photo-label.has-photos {
  padding: 0.85rem 1rem;
  flex-direction: row;
  gap: 0.5rem;
}

.photo-icon {
  font-size: 1.75rem;
}

.photo-label.has-photos .photo-icon {
  font-size: 1.2rem;
}

.photo-text {
  font-size: 0.9rem;
  color: var(--muted);
  font-weight: 500;
}

.photo-hint {
  font-size: 0.8rem;
  color: #94a3b8;
}

.photo-label.has-photos .photo-hint {
  display: none;
}

.photo-preview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 0.65rem;
  margin-top: 0.75rem;
}

.photo-preview-item {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
  background: #e2e8f0;
}

.photo-preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.remove-photo {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: none;
  background: rgba(239, 68, 68, 0.95);
  color: #fff;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
}

.remove-photo:hover {
  background: #dc2626;
}

.output-photo-wrap {
  margin-top: 1rem;
}

.output-photo-label {
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  color: var(--muted);
}

.share-note {
  margin-top: 0.75rem;
  font-size: 0.85rem;
  color: var(--muted);
  text-align: center;
  line-height: 1.4;
}

/* Mobile */
@media (max-width: 520px) {
  .form-grid {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 1.35rem;
  }

  body {
    padding: 0.85rem;
  }
}

/* History */
.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-bottom: 0.5rem;
}

.history-desc {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 1rem;
}

.history-actions {
  display: flex;
  gap: 0.5rem;
}

.btn-small {
  padding: 0.4rem 0.7rem;
  border: none;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}

.btn-small.secondary {
  background: #e2e8f0;
  color: var(--text);
}

.btn-small.danger {
  background: #fee2e2;
  color: #b91c1c;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  max-height: min(70vh, 640px);
  overflow-y: auto;
  padding-right: 2px;
}

.history-empty {
  text-align: center;
  color: #94a3b8;
  font-size: 0.9rem;
  padding: 1.5rem 0;
}

.history-item {
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.85rem 1rem;
}

.history-item-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 0.5rem;
  margin-bottom: 0.4rem;
}

.history-item-title {
  font-weight: 600;
  font-size: 0.92rem;
}

.history-item-date {
  font-size: 0.75rem;
  color: var(--muted);
  white-space: nowrap;
}

.history-item-meta {
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 0.6rem;
  line-height: 1.4;
}

.history-item-actions {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
}

.history-item-actions button {
  padding: 0.35rem 0.65rem;
  border: none;
  border-radius: 6px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  background: #e2e8f0;
  color: var(--text);
}

.history-item-actions button.whatsapp-sm {
  background: var(--whatsapp);
  color: #fff;
}

.history-item-actions button.danger-sm {
  background: #fee2e2;
  color: #b91c1c;
}

.form-spacer { height: 0.5rem; }
.dynamic-form .field { margin-bottom: 0.85rem; }
.dynamic-form .field label { margin-bottom: 0.3rem; }


.input.readonly {
  background: #f1f5f9 !important;
  color: #0f172a !important;
  font-weight: 500;
  border: 1px solid #cbd5e1;
}

.history-group {
  margin-bottom: 1.25rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
}
.history-group-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
  padding: 0.7rem 1rem;
  background: #eff6ff;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.history-group-header:hover {
  background: #dbeafe;
}
.history-group-header-left {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
  flex: 1;
}
.history-group-chevron {
  flex-shrink: 0;
  width: 1.25rem;
  height: 1.25rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  color: var(--primary);
  transition: transform 0.2s ease;
}
.history-group.collapsed .history-group-chevron {
  transform: rotate(-90deg);
}
.history-group.collapsed .history-group-header {
  border-bottom: none;
}
.history-group.collapsed .history-group-body {
  display: none;
}
.history-group-body {
  max-height: 280px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.history-group-body::-webkit-scrollbar {
  width: 6px;
}
.history-group-body::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 999px;
}
.history-group-body::-webkit-scrollbar-track {
  background: #f1f5f9;
}
.history-group-title {
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.history-group-count {
  font-size: 0.78rem;
  color: var(--muted);
  background: #fff;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.history-group .history-item {
  border: none;
  border-radius: 0;
  border-bottom: 1px solid #f1f5f9;
  margin: 0;
}
.history-group .history-item:last-child {
  border-bottom: none;
}
.history-photos {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin: 0.5rem 0 0.65rem;
}
.history-photos img {
  width: 56px;
  height: 56px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.history-item-actions button.edit-sm {
  background: #dbeafe;
  color: #1d4ed8;
}
.btn.share {
  background: var(--whatsapp);
  color: #fff;
}
.btn.share:hover {
  background: var(--whatsapp-dark);
}
.history-item-actions button.share-sm {
  background: var(--whatsapp);
  color: #fff;
}

.input.input-error {
  border-color: #ef4444 !important;
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2) !important;
  background: #fef2f2;
}
.field-error {
  display: none;
  margin-top: 0.35rem;
  font-size: 0.8rem;
  font-weight: 600;
  color: #dc2626;
}
.field-error.visible {
  display: block;
}
.form-error-banner {
  display: none;
  margin-bottom: 1rem;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #b91c1c;
  font-size: 0.9rem;
  font-weight: 600;
  text-align: center;
}
.form-error-banner.visible {
  display: block;
  animation: flashError 0.45s ease;
}
@keyframes flashError {
  0%, 100% { opacity: 1; }
  25% { opacity: 0.4; }
  50% { opacity: 1; }
  75% { opacity: 0.4; }
}

</style>
</head>

      <h1>📋 ROBOTEXT GENERATOR</h1>
      <p>Select a template, fill the fields, generate & share</p>
    </header>

    <section class="card">
      <label for="templateSelect" class="label">Select Template</label>
      <select id="templateSelect" class="select">
        <option value="">— Choose a template —</option>
      </select>
    </section>

    <section id="formSection" class="card hidden">

        <button id="clearBtn" class="btn secondary">Clear</button>
      </div>

    <section id="outputSection" class="card hidden">
      <h2 class="section-title">Generated Text</h2>
      <textarea id="outputText" class="output" rows="16" readonly></textarea>
      <div id="outputPhotoWrap" class="output-photo-wrap hidden">
        <p class="output-photo-label">Photos to share:</p>
        <div id="outputPhotoGrid" class="photo-preview-grid"></div>
      </div>
      <div class="actions">
        <button id="shareBtn" class="btn share">💬 Share</button>
      </div>
      <p id="shareNote" class="share-note hidden"></p>
    </section>

    <section class="card">
      <div class="history-header">

      <div id="historyList" class="history-list">
        <p class="history-empty">No saved records yet.</p>
      </div>
    </section>
  </div>

function formatDate(isoDate) {
  if (!isoDate) return "";
  const p = isoDate.split("-");
  return p[1] + "/" + p[2] + "/" + p[0];
}

function formatDateTime(ts) {
  const d = new Date(ts);
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");
  return mm + "/" + dd + "/" + yyyy + " " + hh + ":" + min;
}

function todayIso() {
  const t = new Date();
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ---- Dynamic form ----

function isYesNoField(label) {
  if (!label) return false;
  var s = String(label).toUpperCase();
  // Free-text fields — never YES/NO
  if (s.indexOf("IF NOT IMPLEMENTED") !== -1) return false;
  if (s.indexOf("REASON") !== -1) return false;
  if (s.indexOf("WHERE") !== -1) return false;
  if (s.indexOf("NC") !== -1 && s.indexOf("OOS") !== -1) return false; // NC or OOS placeholder
  if (s.indexOf("Y/N") !== -1) return true;
  if (s.indexOf("(Y/N)") !== -1) return true;
  if (s.indexOf("YES/NO") !== -1) return true;
  if (s.indexOf("YES / NO") !== -1) return true;
  var keys = [
    "DISER UPDATE", "SHELF TAG UPDATED",
    "PRICE POSM IMPLEMENTED", "SECONDARY DISPLAY",
    "AVAILABLE"
  ];
  for (var i = 0; i < keys.length; i++) {
    if (s.indexOf(keys[i]) !== -1) return true;
  }
  return false;
}

function isNcOosField(label) {
  if (!label) return false;
  var s = String(label).toUpperCase();
  return s.indexOf("NC") !== -1 && s.indexOf("OOS") !== -1;
}

function isPlacementDateField(label) {
  if (!label) return false;
  var s = String(label).toUpperCase().replace(/\s+/g, " ").trim();
  return s.indexOf("PLACEMENT DATE") !== -1 || s === "PLACEMENT DATE:";
}

function isValidYesNo(val) {
  var v = String(val || "").trim().toUpperCase();
  return v === "YES" || v === "NO";
}

function isValidNcOos(val) {
  var v = String(val || "").trim().toUpperCase();
  return v === "NC" || v === "OOS";
}

function normalizeYesNo(val) {
  return String(val || "").trim().toUpperCase();
}

function normalizeNcOos(val) {
  return String(val || "").trim().toUpperCase();
}

function clearFieldErrors() {
  dynamicForm.querySelectorAll(".input-error").forEach(function (el) {
    el.classList.remove("input-error");
  });
  dynamicForm.querySelectorAll(".field-error").forEach(function (el) {
    el.classList.remove("visible");
    el.textContent = "";
  });
  var banner = document.getElementById("formErrorBanner");
  if (banner) {
    banner.classList.remove("visible");
    banner.textContent = "";
  }
}

function setFieldError(inputEl, message) {
  if (!inputEl) return;
  inputEl.classList.add("input-error");
  var field = inputEl.closest(".field");
  if (!field) return;
  var err = field.querySelector(".field-error");
  if (!err) {
    err = document.createElement("div");
    err.className = "field-error";
    field.appendChild(err);
  }
  err.textContent = message;
  err.classList.add("visible");
}

function validateForm() {
  clearFieldErrors();
  var errors = [];
  var firstErrorEl = null;

  function fail(el, msg) {
    errors.push(msg);
    setFieldError(el, msg);
    if (!firstErrorEl && el) firstErrorEl = el;
  }

  // Date required
  var dateEl = document.getElementById("field_date");
  if (dateEl && !String(dateEl.value || "").trim()) {
    fail(dateEl, "Date is required.");
  }

  // Store required (must select from list so hidden has value)
  var storeSearch = document.getElementById("storeSearch");
  var storeNameHidden = document.getElementById("storeName");
  var storeVal = (storeNameHidden && storeNameHidden.value) || "";
  if (!storeVal.trim()) {
    fail(storeSearch, "Select a store from the list.");
  }

  // Supervisor / addcode should auto-fill with store
  var supervisorEl = document.getElementById("field_supervisor");
  var addcodeEl = document.getElementById("field_addcode");
  if (supervisorEl && !String(supervisorEl.value || "").trim()) {
    fail(supervisorEl, "Area Supervisor is required (select a store).");
  }
  if (addcodeEl && !String(addcodeEl.value || "").trim()) {
    fail(addcodeEl, "Address Code is required (select a store).");
  }

  // All free inputs required + format rules
  Array.from(dynamicForm.querySelectorAll('[data-role="input"]')).forEach(function (inp) {
    var label = inp.getAttribute("data-label") || "This field";
    var raw = String(inp.value || "").trim();

    if (!raw) {
      fail(inp, label + " is required.");
      return;
    }

    if (isPlacementDateField(label)) {
      // date input value is YYYY-MM-DD
      if (!raw) {
        fail(inp, "Placement Date is required.");
      }
      return;
    }

    if (isNcOosField(label)) {
      if (!isValidNcOos(raw)) {
        fail(inp, "Enter NC or OOS only.");
      } else {
        inp.value = normalizeNcOos(raw);
      }
      return;
    }

    if (isYesNoField(label)) {
      if (!isValidYesNo(raw)) {
        fail(inp, "Enter YES or NO only.");
      } else {
        inp.value = normalizeYesNo(raw);
      }
    }
  });

  var banner = document.getElementById("formErrorBanner");
  if (errors.length) {
    if (banner) {
      banner.textContent = "Please fix " + errors.length + " error(s) before generating.";
      banner.classList.add("visible");
    }
    if (firstErrorEl) {
      firstErrorEl.scrollIntoView({ behavior: "smooth", block: "center" });
      try { firstErrorEl.focus(); } catch (e) { /* ignore */ }
    }
    return false;
  }
  return true;
}

function renderForm(name) {
  const lines = TEMPLATES_DATA[name];
  if (!lines) return;
  currentTemplateName = name;
  templateTitle.textContent = name;
  dynamicForm.innerHTML = "";

  // Error banner at top of form
  var banner = document.createElement("div");
  banner.id = "formErrorBanner";
  banner.className = "form-error-banner";
  dynamicForm.appendChild(banner);

  // Reorder for display: Date → Store → Supervisor → Address Code → rest
  // (generated text still follows original Excel order)
  const headerOrder = { date: 0, store: 1, supervisor: 2, addcode: 3 };
  const headers = [];
  const rest = [];
  lines.forEach(function (line, idx) {
    if (line.type === "title") return; // shown in templateTitle
    if (line.type in headerOrder) {
      headers.push(line);
    } else {
      rest.push(line);
    }
  });
  headers.sort(function (a, b) {
    return headerOrder[a.type] - headerOrder[b.type];
  });
  const displayLines = headers.concat(rest);

  displayLines.forEach(function (line) {
    if (line.type === "blank") {
      const spacer = document.createElement("div");
      spacer.className = "form-spacer";
      dynamicForm.appendChild(spacer);
      return;
    }

    const field = document.createElement("div");
    field.className = "field full";

    if (line.type === "date") {
      field.innerHTML =
        '<label>Date</label>' +
        '<input type="date" class="input" data-role="date" id="field_date" value="' + todayIso() + '" />';
    } else if (line.type === "store") {
      field.innerHTML =
        '<label>Store Name</label>' +
        '<div class="search-wrap">' +
          '<input type="text" class="input" id="storeSearch" placeholder="Type to search store..." autocomplete="off" />' +
          '<ul id="storeDropdown" class="dropdown hidden"></ul>' +
        '</div>' +
        '<input type="hidden" id="storeName" />';
    } else if (line.type === "supervisor") {
      field.innerHTML =
        '<label>Area Supervisor</label>' +
        '<input type="text" class="input readonly" id="field_supervisor" readonly placeholder="Auto-filled" />';
    } else if (line.type === "addcode") {
      field.innerHTML =
        '<label>Address Code</label>' +
        '<input type="text" class="input readonly" id="field_addcode" readonly placeholder="Auto-filled" />';
    } else if (line.type === "prefilled") {
      field.innerHTML =
        '<label>' + escapeHtml(line.label) + '</label>' +
        '<input type="text" class="input readonly" data-role="prefilled" data-label="' + escapeHtml(line.label) + '" value="' + escapeHtml(line.value) + '" readonly />';
    } else if (line.type === "input") {
      if (isPlacementDateField(line.label)) {
        field.innerHTML =
          '<label>' + escapeHtml(line.label) + ' <span style="color:#dc2626">*</span></label>' +
          '<input type="date" class="input" data-role="input" data-label="' + escapeHtml(line.label) + '" data-key="' + escapeHtml(line.key) + '" data-placement-date="1" value="" />' +
          '<div class="field-error"></div>';
      } else {
        var ph = "Enter value...";
        var extraClass = "";
        if (isNcOosField(line.label)) {
          ph = "NC or OOS only";
          extraClass = " input-nc-oos";
        } else if (isYesNoField(line.label)) {
          ph = "YES or NO only";
          extraClass = " input-yes-no";
        }
        field.innerHTML =
          '<label>' + escapeHtml(line.label) + ' <span style="color:#dc2626">*</span></label>' +
          '<input type="text" class="input' + extraClass + '" data-role="input" data-label="' + escapeHtml(line.label) + '" data-key="' + escapeHtml(line.key) + '" placeholder="' + ph + '" />' +
          '<div class="field-error"></div>';
      }
    }

    if (line.type === "date" || line.type === "store") {
      // ensure error slot exists
      if (!field.querySelector(".field-error")) {
        field.innerHTML += '<div class="field-error"></div>';
      }
    }

    dynamicForm.appendChild(field);
  });

  // Live normalize / light validate for YES/NO and NC/OOS
  dynamicForm.querySelectorAll(".input-yes-no, .input-nc-oos").forEach(function (inp) {
    inp.addEventListener("blur", function () {
      var label = inp.getAttribute("data-label") || "";
      var raw = String(inp.value || "").trim();
      if (!raw) return;
      if (inp.classList.contains("input-yes-no")) {
        if (isValidYesNo(raw)) {
          inp.value = normalizeYesNo(raw);
          inp.classList.remove("input-error");
          var fe = inp.closest(".field") && inp.closest(".field").querySelector(".field-error");
          if (fe) { fe.classList.remove("visible"); fe.textContent = ""; }
        }
      } else if (inp.classList.contains("input-nc-oos")) {
        if (isValidNcOos(raw)) {
          inp.value = normalizeNcOos(raw);
          inp.classList.remove("input-error");
          var fe2 = inp.closest(".field") && inp.closest(".field").querySelector(".field-error");
          if (fe2) { fe2.classList.remove("visible"); fe2.textContent = ""; }
        }
      }
    });
  });

  wireStoreSearch();
}

function wireStoreSearch() {
  const storeSearch = document.getElementById("storeSearch");
  const storeDropdown = document.getElementById("storeDropdown");
  const storeNameHidden = document.getElementById("storeName");
  const supervisorInput = document.getElementById("field_supervisor");
  const addcodeInput = document.getElementById("field_addcode");
  if (!storeSearch) return;

  storeSearch.addEventListener("input", function () {
    const q = storeSearch.value.trim().toLowerCase();
    storeNameHidden.value = "";
    if (supervisorInput) supervisorInput.value = "";
    if (addcodeInput) addcodeInput.value = "";

    if (q.length < 1) {
      storeDropdown.classList.add("hidden");
      storeDropdown.innerHTML = "";
      return;
    }

    filteredStores = STORES.filter(function (s) {
      return s.store.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 50);

    if (filteredStores.length === 0) {
      storeDropdown.innerHTML = '<li style="color:#94a3b8;cursor:default">No stores found</li>';
      storeDropdown.classList.remove("hidden");
      return;
    }

    storeDropdown.innerHTML = filteredStores.map(function (s, i) {
      return '<li data-index="' + i + '">' + escapeHtml(s.store) + '</li>';
    }).join("");
    storeDropdown.classList.remove("hidden");
  });

  storeDropdown.addEventListener("click", function (e) {
    const li = e.target.closest("li[data-index]");
    if (!li) return;
    const store = filteredStores[parseInt(li.dataset.index, 10)];
    storeSearch.value = store.store;
    storeNameHidden.value = store.store;
    if (supervisorInput) supervisorInput.value = store.supervisor || "";
    if (addcodeInput) addcodeInput.value = store.addcode || "";
    storeDropdown.classList.add("hidden");
  });
}

// ---- Generate text from template structure ----
function buildText() {
  const lines = TEMPLATES_DATA[currentTemplateName];
  if (!lines) return "";

  const dateEl = document.getElementById("field_date");
  const storeEl = document.getElementById("storeName");
  const storeSearch = document.getElementById("storeSearch");
  const supervisorEl = document.getElementById("field_supervisor");
  const addcodeEl = document.getElementById("field_addcode");

  const dateStr = dateEl ? formatDate(dateEl.value) : "";
  const store = (storeEl && storeEl.value) || (storeSearch && storeSearch.value) || "";
  const supervisor = supervisorEl ? supervisorEl.value : "";
  const addcode = addcodeEl ? addcodeEl.value : "";

  // Collect all input/prefilled values in order
  const prefilledInputs = Array.from(dynamicForm.querySelectorAll('[data-role="prefilled"]'));
  const freeInputs = Array.from(dynamicForm.querySelectorAll('[data-role="input"]'));
  let preIdx = 0;
  let freeIdx = 0;

  const out = [];
  lines.forEach(function (line) {
    if (line.type === "blank") {
      out.push("");
    } else if (line.type === "title") {
      out.push(line.value);
    } else if (line.type === "date") {
      out.push("Date: " + dateStr);
    } else if (line.type === "supervisor") {
      out.push("Area Supervisor: " + supervisor);
    } else if (line.type === "store") {
      out.push("Store Name: " + store);
    } else if (line.type === "addcode") {
      out.push("Address Code: " + addcode);
    } else if (line.type === "prefilled") {
      // Always from template (readonly fields)
      out.push(line.label + ": " + (line.value || ""));
      preIdx++;
    } else if (line.type === "input") {
      const inp = freeInputs[freeIdx++];
      var val = inp ? inp.value : "";
      // Placement Date picker stores ISO (YYYY-MM-DD) — format for output text
      if (inp && (inp.getAttribute("data-placement-date") === "1" || isPlacementDateField(inp.getAttribute("data-label")))) {
        val = formatDate(val) || val;
      }
      out.push(line.label + ": " + val);
    }
  });

  return out.join("\n");
}



function compressImageToBase64(file, maxWidth, quality) {
  maxWidth = maxWidth || 1280;
  quality = quality || 0.7;
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement("canvas");
        var scale = Math.min(1, maxWidth / img.width);
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL("image/jpeg", quality);
        var base64 = dataUrl.split(",")[1] || "";
        resolve({
          name: (file.name || "photo").replace(/\.[^.]+$/, "") + ".jpg",
          type: "image/jpeg",
          data: base64
        });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function base64ToFile(photo) {
  try {
    var bin = atob(photo.data);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], photo.name || "photo.jpg", { type: photo.type || "image/jpeg" });
  } catch (e) {
    return null;
  }
}

function photosToDataUrls(photoObjs) {
  return (photoObjs || []).map(function (p) {
    return {
      name: p.name || "photo.jpg",
      type: p.type || "image/jpeg",
      data: p.data,
      dataUrl: "data:" + (p.type || "image/jpeg") + ";base64," + p.data
    };
  });
}

function getCurrentRecord(text) {
  var dateEl = document.getElementById("field_date");
  var storeEl = document.getElementById("storeName");
  var storeSearch = document.getElementById("storeSearch");
  var supervisorEl = document.getElementById("field_supervisor");
  var addcodeEl = document.getElementById("field_addcode");
  return {
    id: String(Date.now()) + "_" + Math.random().toString(36).slice(2, 8),
    savedAt: Date.now(),
    template: currentTemplateName || "",
    date: dateEl ? formatDate(dateEl.value) : "",
    store: (storeEl && storeEl.value) || (storeSearch && storeSearch.value) || "",
    supervisor: supervisorEl ? supervisorEl.value : "",
    addcode: addcodeEl ? addcodeEl.value : "",
    text: text || "",
    photos: []
  };
}

function saveToGoogleSheet(record, photoFiles) {
  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.indexOf("http") !== 0) {
    return Promise.resolve({ skipped: true });
  }
  photoFiles = photoFiles || [];
  var chain = Promise.resolve([]);
  if (photoFiles.length) {
    chain = Promise.all(photoFiles.slice(0, 5).map(function (f) {
      return compressImageToBase64(f, 1280, 0.7);
    }));
  }
  return chain.then(function (photos) {
    var payload = {
      template: record.template || "",
      date: record.date || "",
      store: record.store || "",
      supervisor: record.supervisor || "",
      addcode: record.addcode || "",
      text: record.text || "",
      photos: photos
    };
    return fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function () {
      return { ok: true, photoCount: photos.length };
    });
  }).catch(function (err) {
    console.error("Google Sheet save failed", err);
    return { ok: false, error: String(err) };
  });
}

function pushToCloud(record, photoFiles, notePrefix) {
  notePrefix = notePrefix || "Saving";
  var hasPhotos = photoFiles && photoFiles.length;
  shareNote.textContent = notePrefix + " to Google Sheet" + (hasPhotos ? " (with photos)..." : "...");
  shareNote.classList.remove("hidden");
  return saveToGoogleSheet(record, photoFiles || []).then(function (res) {
    if (res && res.skipped) {
      shareNote.classList.add("hidden");
      return res;
    }
    if (res && res.ok) {
      shareNote.textContent = "Saved to Google Sheet ✓" + (res.photoCount ? (" + " + res.photoCount + " photo(s)") : "");
    } else {
      shareNote.textContent = "Could not save to Google Sheet. Check Apps Script deploy.";
    }
    setTimeout(function () { shareNote.classList.add("hidden"); }, 5000);
    return res;
  });
}


generateBtn.addEventListener("click", function () {
  if (!currentTemplateName) return;
  if (!validateForm()) return;

  const text = buildText();
  outputText.value = text;
  renderOutputPhotos();
  shareNote.classList.add("hidden");
  outputSection.classList.remove("hidden");
  outputSection.scrollIntoView({ behavior: "smooth", block: "start" });

  var photoFiles = selectedPhotos.map(function (p) { return p.file; });
  var record = getCurrentRecord(text);
  var replaceId = editingHistoryId;

  var prep = photoFiles.length
    ? Promise.all(photoFiles.slice(0, 5).map(function (f) { return compressImageToBase64(f, 1280, 0.7); }))
    : Promise.resolve([]);

  prep.then(function (photoObjs) {
    record.photos = photosToDataUrls(photoObjs);
    // If editing: remove the old history entry, then save the new one
    if (replaceId) {
      removeFromHistory(replaceId);
      editingHistoryId = null;
    }
    addToHistory(record);
    pushToCloud(record, photoFiles, "Saving text" + (photoFiles.length ? " + photos" : ""));
  }).catch(function () {
    record.photos = [];
    if (replaceId) {
      removeFromHistory(replaceId);
      editingHistoryId = null;
    }
    addToHistory(record);
    pushToCloud(record, photoFiles, "Saving text");
  });
});

// ---- Share (WhatsApp only) ----
function shareText(text, files) {
  files = files || [];
  shareNote.classList.add("hidden");
  text = text || "";

  // Prefer system share with files when available (user can pick WhatsApp)
  // Always also open WhatsApp text link as reliable text delivery
  function openWhatsAppText() {
    window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
  }

  if (files.length && typeof navigator.share === "function") {
    var data = { text: text };
    var canFiles = false;
    if (navigator.canShare) {
      try {
        if (navigator.canShare({ files: files })) {
          data.files = files;
          canFiles = true;
        }
      } catch (e) { /* ignore */ }
    }
    if (canFiles) {
      data.title = "ROBOTEXT";
      navigator.share(data).then(function () {
        // Shared via sheet — if user picked WhatsApp with photos, good
      }).catch(function (err) {
        if (err && err.name === "AbortError") return;
        openWhatsAppText();
        if (files.length) {
          shareNote.textContent = files.length + " photo(s) — attach them manually in WhatsApp.";
          shareNote.classList.remove("hidden");
        }
      });
      return;
    }
  }

  openWhatsAppText();
  if (files.length) {
    shareNote.textContent = files.length + " photo(s) cannot be attached automatically. Attach them in WhatsApp.";
    shareNote.classList.remove("hidden");
  }
}

function doShareFromOutput() {
  const text = outputText.value;
  if (!text) return;
  var photoFiles = selectedPhotos.map(function (p) { return p.file; }).filter(Boolean);
  var record = getCurrentRecord(text || "");
  var prep = photoFiles.length
    ? Promise.all(photoFiles.slice(0, 5).map(function (f) { return compressImageToBase64(f, 1280, 0.7); }))
    : Promise.resolve([]);
  prep.then(function (photoObjs) {
    record.photos = photosToDataUrls(photoObjs);
    pushToCloud(record, photoFiles, "Saving text" + (photoFiles.length ? " + photos" : ""));
  });
  shareText(text || "", photoFiles);
}

// ---- History ----
function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveHistory(list) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
}

function addToHistory(record) {
  const list = loadHistory();
  list.unshift(record);
  if (list.length > 200) list.length = 200;
  saveHistory(list);
  renderHistory();
}

function removeFromHistory(id) {
  if (!id) return;
  const list = loadHistory().filter(function (r) { return r.id !== id; });
  saveHistory(list);
  renderHistory();
}

function loadCollapsedStores() {
  try {
    const raw = localStorage.getItem(HISTORY_COLLAPSE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function saveCollapsedStores(map) {
  try {
    localStorage.setItem(HISTORY_COLLAPSE_KEY, JSON.stringify(map || {}));
  } catch (e) { /* ignore */ }
}

function setStoreCollapsed(storeKey, collapsed) {
  const map = loadCollapsedStores();
  if (collapsed) map[storeKey] = true;
  else delete map[storeKey];
  saveCollapsedStores(map);
}

function renderHistory() {
  const list = loadHistory();
  historyList.innerHTML = "";
  if (!list.length) {
    historyList.innerHTML = '<p class="history-empty">No saved records yet.</p>';
    return;
  }

  // Group by store name
  const groups = {};
  list.forEach(function (rec) {
    const key = (rec.store && String(rec.store).trim()) || "— Unknown store —";
    if (!groups[key]) groups[key] = [];
    groups[key].push(rec);
  });

  const storeNames = Object.keys(groups).sort(function (a, b) {
    return a.localeCompare(b, undefined, { sensitivity: "base" });
  });
  const collapsedMap = loadCollapsedStores();

  storeNames.forEach(function (storeName) {
    const records = groups[storeName];
    const isCollapsed = !!collapsedMap[storeName];
    const section = document.createElement("div");
    section.className = "history-group" + (isCollapsed ? " collapsed" : "");
    section.dataset.store = storeName;

    const header = document.createElement("div");
    header.className = "history-group-header";
    header.setAttribute("role", "button");
    header.setAttribute("aria-expanded", isCollapsed ? "false" : "true");
    header.innerHTML =
      '<div class="history-group-header-left">' +
        '<span class="history-group-chevron" aria-hidden="true">▼</span>' +
        '<span class="history-group-title" title="' + escapeHtml(storeName) + '">' + escapeHtml(storeName) + '</span>' +
      '</div>' +
      '<span class="history-group-count">' + records.length + ' record' + (records.length > 1 ? "s" : "") + '</span>';
    section.appendChild(header);

    const body = document.createElement("div");
    body.className = "history-group-body";

    records.forEach(function (rec) {
      const item = document.createElement("div");
      item.className = "history-item";
      // Photos are stored in the record but not shown in history list
      item.innerHTML =
        '<div class="history-item-top">' +
          '<div class="history-item-title">' + escapeHtml(rec.template || "—") + '</div>' +
          '<div class="history-item-date">' + escapeHtml(formatDateTime(rec.savedAt)) + '</div>' +
        '</div>' +
        '<div class="history-item-meta">' +
          'Date: ' + escapeHtml(rec.date || "—") +
          ' · Supervisor: ' + escapeHtml(rec.supervisor || "—") +
          (rec.addcode ? ' · ' + escapeHtml(rec.addcode) : '') +
          (rec.photos && rec.photos.length ? ' · 📷 ' + rec.photos.length + ' photo(s)' : '') +
        '</div>' +
        '<div class="history-item-actions">' +
          '<button type="button" class="edit-sm" data-action="edit" data-id="' + rec.id + '">Edit</button>' +
          '<button type="button" class="share-sm" data-action="share" data-id="' + rec.id + '">💬 Share</button>' +
          '<button type="button" class="danger-sm" data-action="delete" data-id="' + rec.id + '">Delete</button>' +
        '</div>';
      body.appendChild(item);
    });

    section.appendChild(body);
    historyList.appendChild(section);
  });
}

function parseDateToIso(displayDate) {
  if (!displayDate) return todayIso();
  var parts = String(displayDate).trim().split(/[\/\-]/);
  if (parts.length !== 3) return todayIso();
  var a = parseInt(parts[0], 10);
  var b = parseInt(parts[1], 10);
  var c = parseInt(parts[2], 10);
  if (!a || !b || !c) return todayIso();
  if (String(c).length === 4) {
    return c + "-" + String(a).padStart(2, "0") + "-" + String(b).padStart(2, "0");
  }
  if (String(a).length === 4) {
    return a + "-" + String(b).padStart(2, "0") + "-" + String(c).padStart(2, "0");
  }
  return todayIso();
}

function applyFieldValuesFromText(text) {
  if (!text) return;
  var lines = String(text).split("\n");
  var map = {};
  lines.forEach(function (line) {
    var idx = line.indexOf(":");
    if (idx === -1) return;
    var label = line.slice(0, idx).trim();
    var val = line.slice(idx + 1).trim();
    if (label) map[label.toUpperCase()] = val;
  });

  Array.from(dynamicForm.querySelectorAll('[data-role="input"]')).forEach(function (inp) {
    var label = (inp.getAttribute("data-label") || "").trim().toUpperCase();
    if (label && map[label] !== undefined) {
      var val = map[label];
      // Placement date inputs need ISO value for the date picker
      if (inp.getAttribute("data-placement-date") === "1" || isPlacementDateField(inp.getAttribute("data-label"))) {
        val = parseDateToIso(val);
      }
      inp.value = val;
    }
  });
}

function editHistoryRecord(rec) {
  if (!rec || !rec.template) {
    alert("This record has no template and cannot be edited.");
    return;
  }
  if (!TEMPLATES_DATA[rec.template]) {
    alert("Template \"" + rec.template + "\" is no longer available.");
    return;
  }

  // Remember which history entry to replace when user generates again
  editingHistoryId = rec.id || null;

  templateSelect.value = rec.template;
  renderForm(rec.template);
  formSection.classList.remove("hidden");

  var dateEl = document.getElementById("field_date");
  if (dateEl) dateEl.value = parseDateToIso(rec.date);

  var storeSearch = document.getElementById("storeSearch");
  var storeNameHidden = document.getElementById("storeName");
  var supervisorInput = document.getElementById("field_supervisor");
  var addcodeInput = document.getElementById("field_addcode");
  if (storeSearch) storeSearch.value = rec.store || "";
  if (storeNameHidden) storeNameHidden.value = rec.store || "";
  if (supervisorInput) supervisorInput.value = rec.supervisor || "";
  if (addcodeInput) addcodeInput.value = rec.addcode || "";

  if (rec.store) {
    var found = STORES.find(function (s) {
      return s.store === rec.store;
    });
    if (found) {
      if (supervisorInput && !rec.supervisor) supervisorInput.value = found.supervisor || "";
      if (addcodeInput && !rec.addcode) addcodeInput.value = found.addcode || "";
    }
  }

  applyFieldValuesFromText(rec.text || "");

  clearPhotos();
  if (rec.photos && rec.photos.length) {
    rec.photos.forEach(function (ph) {
      var f = base64ToFile(ph);
      if (!f) return;
      var url = ph.dataUrl || ("data:" + (ph.type || "image/jpeg") + ";base64," + ph.data);
      selectedPhotos.push({ file: f, url: url });
    });
    renderPhotoPreviews();
  }

  outputText.value = rec.text || "";
  renderOutputPhotos();
  shareNote.classList.add("hidden");
  outputSection.classList.remove("hidden");

  formSection.scrollIntoView({ behavior: "smooth", block: "start" });
  shareNote.textContent = "Editing — when you Generate, the old history entry will be replaced.";
  shareNote.classList.remove("hidden");
  setTimeout(function () { shareNote.classList.add("hidden"); }, 4500);
}

historyList.addEventListener("click", function (e) {
  const header = e.target.closest(".history-group-header");
  if (header && !e.target.closest("button")) {
    const section = header.closest(".history-group");
    if (section) {
      const storeKey = section.dataset.store || "";
      const nowCollapsed = !section.classList.contains("collapsed");
      section.classList.toggle("collapsed", nowCollapsed);
      header.setAttribute("aria-expanded", nowCollapsed ? "false" : "true");
      setStoreCollapsed(storeKey, nowCollapsed);
    }
    return;
  }

  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const list = loadHistory();
  const rec = list.find(function (r) { return r.id === id; });
  if (!rec) return;

  if (action === "share") {
    var filesH = [];
    if (rec.photos && rec.photos.length) {
      rec.photos.forEach(function (ph) {
        var f = base64ToFile(ph);
        if (f) filesH.push(f);
      });
    }
    shareText(rec.text || "", filesH);
  } else if (action === "edit") {
    editHistoryRecord(rec);
  } else if (action === "delete") {
    if (confirm("Delete this record?")) {
      saveHistory(list.filter(function (r) { return r.id !== id; }));
      renderHistory();
    }
  }
});

if (expandAllHistoryBtn) {
  expandAllHistoryBtn.addEventListener("click", function () {
    saveCollapsedStores({});
    renderHistory();
  });
}
if (collapseAllHistoryBtn) {
  collapseAllHistoryBtn.addEventListener("click", function () {
    const list = loadHistory();
    const map = {};
    list.forEach(function (rec) {
      const key = (rec.store && String(rec.store).trim()) || "— Unknown store —";
      map[key] = true;
    });
    saveCollapsedStores(map);
    renderHistory();
  });
}

exportHistoryBtn.addEventListener("click", function () {
  const list = loadHistory();
  if (!list.length) { alert("No history to export."); return; }
  let csv = "Saved At,Template,Date,Store Name,Area Supervisor,Address Code,Text\n";
  list.forEach(function (r) {
    function q(v) { return '"' + String(v || "").replace(/"/g, '""') + '"'; }
    csv += [q(formatDateTime(r.savedAt)), q(r.template), q(r.date), q(r.store), q(r.supervisor), q(r.addcode), q(r.text)].join(",") + "\n";
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "posm_history.csv";
  a.click();
  URL.revokeObjectURL(url);
});

if (document.getElementById("clearHistoryBtn")) {
  document.getElementById("clearHistoryBtn").addEventListener("click", function () {
    if (confirm("Clear ALL saved history on this phone?")) {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    }
  });
}

renderHistory();

</script>
</body>
</html>
